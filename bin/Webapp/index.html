<!doctype html>
<html lang="nl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Inloggen · TimeTracking</title>
    <link rel="icon" type="image/svg+xml" href="images/timetracking-favicon.svg">
    <link rel="shortcut icon" href="images/timetracking-favicon.svg">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/typography.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/timetracking-ui.css">
    <script src="js/branding.js"></script>
</head>

<body class="tt-login-body">
    <main class="tt-login-shell">
        <div class="tt-login-intro">
            <div class="tt-shell-brand">
                <span class="tt-brand-mark" aria-hidden="true"></span>
                <div class="tt-shell-brand__text">
                    <span class="tt-shell-brand__eyebrow">Q-Home</span>
                    <span class="tt-shell-brand__title">TimeTracking</span>
                </div>
            </div>
            <div class="tt-login-intro__copy">
                <p class="tt-kicker">Tijdsregistratie</p>
                <h2>Je werkdag in één overzicht</h2>
                <p>Bekijk je geregistreerde uren, pauzes en badge-scans.</p>
            </div>
        </div>
        <section class="tt-login-card" aria-labelledby="loginTitle">
            <div class="tt-login-header">
                <h1 id="loginTitle">Welkom terug</h1>
                <p>Qtime is toegankelijk voor HR en bevoegde beheerders. Medewerkers worden via Loxone geregistreerd.</p>
            </div>

            <form id="loginForm" class="tt-login-form">
                <div class="form-group">
                    <label for="username">Gebruikersnaam of e-mail</label>
                    <input type="text" class="form-control tt-login-input" id="username" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Wachtwoord</label>
                    <input type="password" class="form-control tt-login-input" id="password" autocomplete="current-password" required>
                </div>
                <button type="submit" class="tt-login-button">Inloggen</button>
                <div id="loginError" class="login-error" role="alert"></div>
            </form>
        </section>
    </main>

    <script src="js/login.js"></script>
</body>

</html>
