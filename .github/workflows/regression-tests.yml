name: Regression tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests -v
      - name: Check application JavaScript syntax
        shell: bash
        run: |
          for file in login app-shell branding settings dashboard get-timesheetdata get-badges get-users edit_user adduser logs datahandler custom; do
            node --check "bin/Webapp/js/$file.js"
          done
